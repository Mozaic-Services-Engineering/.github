# Mozaic PR risk hints for the Independent PR Reviewer Agent Trial.
# Canonical policy: https://github.com/Mozaic-Services-Engineering/mozaic-platform-docs/blob/main/docs/engineering/governance/independent-pr-reviewer-agent-trial.md
version: 1
policy: independent-pr-reviewer-agent-trial

high_risk:
  requires_named_human_approval: true
  paths:
    - ".github/workflows/**"
    - ".github/actions/**"
    - ".mozaic/**"
    - "AGENTS.md"
    - "**/AGENTS.md"
    - "infra/**"
    - "terraform/**"
    - "**/*.tf"
    - "**/*.tfvars"
    - "**/db/migration/**"
    - "**/migrations/**"
    - "**/security/**"
    - "**/auth/**"
    - "**/iam/**"
    - "**/kms/**"
    - "**/secrets/**"
    - "**/application*.yml"
    - "**/application*.yaml"
    - "**/application*.properties"
    - "**/*Security*"
    - "**/*Auth*"
    - "**/*Token*"
    - "**/*Session*"
    - "**/*Tenant*"
    - "**/*Secret*"
    - "**/*Credential*"
    - "**/*Kms*"
    - "**/*Iam*"
    - "**/*Migration*"
    - "**/*Approval*"
    - "**/*Audit*"
    - "**/*Evidence*"
    - "**/*Retention*"
    - "**/*Deletion*"
    - "**/*Apply*"
    - "**/*Mutation*"
  halo_specific_paths:
    - "**/*Apply*"
    - "**/*Mutation*"
    - "**/*Credential*"
    - "**/*Approval*"
    - "**/*SafeHandling*"
    - "**/*Endpoint*Policy*"
    - "**/*BreakGlass*"
  keywords:
    - auth
    - authorization
    - tenant
    - token
    - session
    - csrf
    - secret
    - credential
    - iam
    - kms
    - migration
    - deletion
    - retention
    - audit
    - evidence custody
    - production promotion
    - release approval
    - halo apply
    - governed mutation
